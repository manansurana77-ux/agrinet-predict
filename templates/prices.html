<!DOCTYPE html>
<html>
<head>
    <title>Price Trends - AgriNet-Predict</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #2d6a4f;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 { margin: 0; font-size: 28px; }
        .header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.85; }
        .nav {
            background-color: #40916c;
            padding: 12px;
            text-align: center;
        }
        .nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 15px;
            font-weight: bold;
        }
        .nav a:hover { text-decoration: underline; }
        .chart-container {
            background: white;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 900px;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🌾 AgriNet-Predict</h1>
    <p>Tomato Price Trends Across Markets</p>
</div>

<div class="nav">
    <a href="/">🏠 Dashboard</a>
    <a href="/prices">📈 Price Trends</a>
    <a href="/graph">🔗 Network Graph</a>
    <a href="/advisory">🔔 Get Advisory</a>
</div>

<div class="chart-container">
    <div id="chart"></div>
</div>

<div class="footer">
    <p>Powered by AgriNet-Predict GNN System | Data: AGMARKNET India</p>
</div>

<script>
    var chart = {{ chart | safe }};
    Plotly.newPlot('chart', chart.data, chart.layout);
</script>

</body>
</html>
